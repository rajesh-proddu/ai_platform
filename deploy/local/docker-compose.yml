# Local dev / e2e stack for the P0 gateway plane.
#
#   agentgateway  :3000   OpenAI-compatible LLM API (/v1/*) + MCP (/mcp)
#   vllm          :8000   CPU-only OpenAI-compatible model server (dev/e2e backend)
#   redis         :6379   P1 session scope + response cache (not yet wired — see gateway/README.md)
#   mcp-everything:3001   sample MCP server behind the gateway's MCP route
#
# Start:  docker compose -f deploy/local/docker-compose.yml up
# Env:    cp deploy/local/.env.example deploy/local/.env   (compose reads .env from this directory)
#
# vLLM on this box is slow by design: first health ~5-8 min (image start, weight download, load),
# and the first request after each start pays ~110 s of compile. See study/01-vllm-on-cpu-local-lab.md.

name: ai-platform-local

services:
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:${AGENTGATEWAY_VERSION:-v1.5.0}
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ../../gateway/config.yaml:/etc/agentgateway/config.yaml:ro
    environment:
      # vLLM ignores the key; agentgateway's openAI provider still expects one.
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      # Only needed when the bedrock provider is actually exercised. Left unset locally so the
      # failover chain stops at vLLM. Never commit real credentials.
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "3000:3000"   # LLM + MCP
      - "15020:15020" # metrics  (config.statsAddr)
      - "15021:15021" # readiness (config.readinessAddr)
    depends_on:
      mcp-everything:
        condition: service_started
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai-cpu:${VLLM_IMAGE_TAG:-latest-x86_64}
    # The model id must match llm.models[].params.model in gateway/config.yaml.
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - --dtype=${VLLM_DTYPE:-float32}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
    environment:
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-1}
    # study/01: these remove the numa_migrate_pages / numa_set_membind permission warnings and
    # cut short-prompt TTFT from ~6 s to ~1.1 s.
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    shm_size: 4gb
    volumes:
      # Weight + compile caches, so restarts do not re-download or re-compile.
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-~/.cache/vllm}:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mcp-everything:
    image: node:22-alpine
    command:
      ["npx", "-y", "@modelcontextprotocol/server-everything", "streamableHttp"]
    environment:
      PORT: "3001"
    expose:
      - "3001"
    restart: unless-stopped

  # --- ai_security inspection service (optional) -----------------------------
  # The guardrail hook in gateway/config.yaml points at `ai-security-inspector:9000` (ext_proc,
  # gRPC) with failureMode: failClosed, so the LLM and MCP routes reject traffic while this is
  # absent. Either flip both failureModes to failOpen for gateway-only work, or enable this once
  # https://github.com/rajesh-proddu/ai_security is checked out alongside this repo.
  #
  # ai-security-inspector:
  #   build:
  #     context: ../../../ai_security
  #     dockerfile: build/Dockerfile
  #   environment:
  #     INSPECTOR_EXTPROC_ADDR: ":9000"   # gRPC ext_proc  — contract, see gateway/README.md
  #     INSPECTOR_HTTP_ADDR: ":8080"      # webhook guard + plain HTTP adapter
  #     INSPECTOR_REDIS_URL: "redis://redis:6379/0"
  #   expose:
  #     - "9000"
  #     - "8080"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
