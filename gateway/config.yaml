#   `llm.policies.localRateLimit` / `remoteRateLimit` and spend controls; the exact token-aware
#   shape was not verified for v1.5.0. See:
#   https://agentgateway.dev/docs/standalone/latest/configuration/resiliency/rate-limits/
# TODO(P0): JWT auth against the platform's shared HS256 secret (HLD §5.2). `llm.policies.jwtAuth`
#   exists (LocalJwtConfig); issuer/JWKS wiring for an HS256 secret was not verified. See:
